[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-factory"
version = "1.0.0"
authors = [
    {name = "Valentin", email = "vpavonlopez@gmail.com"}
]
description = "🏭 Create custom AI models in 5 minutes. Local, free, web interface included. No coding required!"
readme = "README_PYPI.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "machine-learning", "models", "deployment", "ollama", "fastapi"]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.6",
]

[project.urls]
Homepage = "https://github.com/valenuser/ai-factory"
Documentation = "https://github.com/valenuser/ai-factory#readme"
Repository = "https://github.com/valenuser/ai-factory.git"
"Bug Tracker" = "https://github.com/valenuser/ai-factory/issues"

[project.scripts]
ai-factory = "ai_factory.cli:main"

[tool.setuptools.packages.find]
include = ["ai_factory*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
"*" = ["templates/*", "*.json", "*.yaml", "*.yml"]